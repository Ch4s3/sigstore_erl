name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['26', '27', '28']
        rebar3: ['3.27']
        include:
          # rebar3 >= 3.25 no longer runs on OTP 25.
          - otp: '25'
            rebar3: '3.22.1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with: { otp-version: "${{ matrix.otp }}", rebar3-version: "${{ matrix.rebar3 }}" }
      - run: rebar3 compile
      - run: rebar3 xref
      - run: rebar3 dialyzer
      - run: rebar3 ct
      - run: rebar3 escriptize
      - run: rebar3 fmt --check
